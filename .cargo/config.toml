# Linux builds link with mold through clang. Both come from the dev shell (flake.nix);
# outside it the link step fails. Override locally with CARGO_TARGET_<TRIPLE>_LINKER.
# Note: an environment RUSTFLAGS replaces the rustflags below.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
