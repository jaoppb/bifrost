msrv = "1.99.1"
excessive-nesting-threshold = 2
too-many-lines-threshold = 25
too-many-arguments-threshold = 3
cognitive-complexity-threshold = 8
max-struct-bools = 0
max-fn-params-bools = 0
min-ident-chars-threshold = 2
allowed-idents-below-min-chars = ["'_"]
single-char-binding-names-threshold = 1
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# arch-lint 0.11.0 (tools/architecture) brings two crates in two versions each:
# syn 2 (arch-lint, miette-derive, tracing-attributes) next to syn 3 (serde_derive,
# schemars_derive, displaydoc), and unicode-width 0.1 (miette) next to 0.2 (textwrap).
# Neither can be unified from here. Remove an entry when an arch-lint release drops it.
allowed-duplicate-crates = ["syn", "unicode-width"]
