name: "Refactor"
description: "Restructure without changing behaviour"
title: "refactor: "
labels: ["type:refactor"]
body:
  - type: markdown
    attributes:
      value: "After filing, set an `area:` label, the release milestone, the parent (sub-issue) and any blocked-by links in GitHub, and Priority and Effort in the Project."
  - type: textarea
    id: goal
    attributes:
      label: "Goal"
      description: "The structure to reach."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "What is wrong with the current structure."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "What moves or changes, as a list."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: "Definition of Done"
      description: "Observable, checkable outcomes."
      value: |
        - [ ] Behaviour is unchanged and the tests prove it
        - [ ] `just check` passes
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: "Non-goals"
      description: "What this deliberately does not do."
