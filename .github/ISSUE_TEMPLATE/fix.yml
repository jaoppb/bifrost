name: "Fix"
description: "Something is broken"
title: "fix: "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: "After filing, set an `area:` label, the release milestone, the parent (sub-issue) and any blocked-by links in GitHub, and Priority and Effort in the Project."
  - type: textarea
    id: goal
    attributes:
      label: "Goal"
      description: "What should happen instead of the bug."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "How to reproduce it, what happens and what was expected."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "What gets changed to fix it."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: "Definition of Done"
      description: "Observable, checkable outcomes."
      value: |
        - [ ] A test fails before the fix and passes after
        - [ ] `just check` passes
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: "Non-goals"
      description: "What this deliberately does not do."
