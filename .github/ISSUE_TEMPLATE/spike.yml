name: "Spike"
description: "Time-boxed research that answers a question"
title: "spike: "
labels: ["type:spike"]
body:
  - type: markdown
    attributes:
      value: "After filing, set an `area:` label, the release milestone, the parent (sub-issue) and any blocked-by links in GitHub, and Priority and Effort in the Project."
  - type: textarea
    id: goal
    attributes:
      label: "Goal"
      description: "The question to answer."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "What is known and why the answer is needed."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "What gets tried and the time box."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: "Definition of Done"
      description: "Observable, checkable outcomes."
      value: |
        - [ ] The question is answered in writing
        - [ ] Follow-up issues are filed
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: "Non-goals"
      description: "What this deliberately does not do."
