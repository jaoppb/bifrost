# Git hooks. Install with `just setup`. Hooks call just recipes (which fail with a clear message
# outside the flake dev shell) and convco; the full gate runs on pre-push because `just lint`
# also fetches the advisory database.

pre-commit:
  parallel: true
  jobs:
    - name: fmt-check
      glob: "*.{rs,md}"
      run: just fmt-check
    - name: clippy
      glob: "*.{rs,toml,lock}"
      run: just clippy

commit-msg:
  jobs:
    - name: convco
      # Titles git generates (merge, revert, fixup) are not conventional commits.
      skip:
        - merge
        - run: grep -qE '^(Merge |Revert "|(fixup|squash|amend)! )' {1}
      run: convco check --strip --from-stdin < {1}

pre-push:
  jobs:
    - name: check
      run: just check
